name: Checksum Update

on:
  pull_request:
    paths:
      - "srcpkgs/**"
    types:
      - opened
      - synchronize
    branches:
      - main

env:
  # void-packages is pinned so CI does not move under us; bump after testing.
  # Last bumped: 2026-11-24.
  VOID_PACKAGES_REF: 6427b98fd6f7739bc187cd94fd2f641e0b939f78

jobs:
  checksum:
    runs-on: ubuntu-24.04
    if: startsWith(github.head_ref, 'renovate/')
    container:
      # Digest pinned deliberately; bump it manually to update the image.
      image: ghcr.io/void-linux/void-glibc-full:latest@sha256:e98f8cdde9e6ca85f8542fad5cdd06032a05dca3bf2b81757949bb24d67afa37
      options: --platform linux/amd64 --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: x86_64
        BOOTSTRAP: x86_64

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Suy xbps && xbps-install -Suy sudo xtools bash git
          useradd -G xbuilder -M builder

      - name: Checkout local templates
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          # Push with RENOVATE_TOKEN: commits pushed with GITHUB_TOKEN do not trigger other workflows.
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Detect changed packages
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            srcpkgs/*/template

      - name: Extract package names
        id: detect
        run: |
          mkdir -p /tmp/changed-pkgs
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "$file"
          done | cut -d/ -f2 | sort -u > /tmp/changed-pkgs/packages.txt
          echo "--- Detected packages ---"
          cat /tmp/changed-pkgs/packages.txt

      - name: Checkout upstream templates
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: ${{ env.VOID_PACKAGES_REF }}
          fetch-depth: 1
          path: upstream

      - name: Prepare masterdir
        working-directory: upstream
        run: |
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          sudo -Eu builder common/travis/prepare.sh

      - name: Copy templates to upstream
        run: |
          cp -av srcpkgs/. upstream/srcpkgs/
          chown -R builder:builder upstream/srcpkgs/

      - name: Generate checksums
        working-directory: upstream
        run: |
          for pkg in $(cat /tmp/changed-pkgs/packages.txt); do
            sudo -Eu builder xgensum -f -i srcpkgs/$pkg/template
          done

      - name: Copy updated templates back
        run: |
          for pkg in $(cat /tmp/changed-pkgs/packages.txt); do
            cp -r "upstream/srcpkgs/$pkg" srcpkgs/
          done

      - name: Commit checksum updates
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add $(find srcpkgs -name template -type f)
          if git diff --staged --quiet; then
            echo "No checksum changes detected"
          else
            git commit -m "Update checksums"
            git push
          fi
