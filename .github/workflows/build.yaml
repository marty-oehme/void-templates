name: Build and Deploy

on:
  push:
    paths:
      - "srcpkgs/**"
    branches:
      - main
  pull_request:
    paths:
      - "srcpkgs/**"
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (leave empty to auto-detect)"
        required: false
        default: ""

jobs:
  policy:
    name: Check version/revision policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local templates
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version and revision
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check.py --offline --base "$BASE"

  build:
    name: Build packages
    runs-on: ubuntu-latest
    # PR runs get their own group so they can never cancel a main build/deploy.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    outputs:
      count: ${{ steps.detect.outputs.count }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              arch: x86_64,
              host: x86_64,
              libc: glibc,
              platform: linux/amd64,
            }
          # - { arch: i686,         host: i686,        libc: glibc, platform: linux/386 }
          # - { arch: aarch64,      host: x86_64,      libc: glibc, platform: linux/amd64 }
          # - { arch: armv7l,       host: x86_64,      libc: glibc, platform: linux/amd64 }
          # - { arch: x86_64-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64 }
          # - { arch: armv6l-musl,  host: x86_64-musl, libc: musl,  platform: linux/amd64 }
          # - { arch: aarch64-musl, host: x86_64-musl, libc: musl,  platform: linux/amd64 }

    container:
      image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:latest
      options: --platform ${{ matrix.config.platform }} --privileged
      volumes:
        - /dev:/dev
      env:
        ARCH: "${{ matrix.config.arch }}"
        BOOTSTRAP: "${{ matrix.config.host }}"

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git
          useradd -G xbuilder -M builder

      - name: Checkout upstream templates
        uses: actions/checkout@v6
        with:
          repository: void-linux/void-packages
          ref: master
          fetch-depth: 1

      - name: Checkout local templates
        uses: actions/checkout@v6
        with:
          path: added-packages
          fetch-depth: 0

      - name: Copy templates
        run: cp -av added-packages/srcpkgs/. srcpkgs/

      - name: Prepare masterdir
        run: |
          chown -R builder:builder . &&
          sudo -Eu builder common/travis/set_mirror.sh &&
          sudo -Eu builder common/travis/prepare.sh &&
          common/travis/fetch-xtools.sh

      - name: Detect changed packages
        id: detect
        working-directory: added-packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PACKAGE: ${{ github.event.inputs.package }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/added-packages"

          head="$HEAD_SHA"
          base=""
          packages=""
          if [ -n "$MANUAL_PACKAGE" ]; then
            echo "Manual package selection: $MANUAL_PACKAGE"
            base="(manual)"
            packages="$MANUAL_PACKAGE"
          else
            case "$EVENT_NAME" in
              pull_request) base="$PR_BASE_SHA" ;;
              push)         base="$PUSH_BEFORE_SHA" ;;
            esac

            # New branches and force pushes report an empty or all-zero "before".
            case "$base" in
              ""|0000000000000000000000000000000000000000) base="" ;;
            esac
            if [ -n "$base" ] && ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
              echo "Base commit $base is not available locally, ignoring it"
              base=""
            fi
            if [ -z "$base" ] && git rev-parse --verify --quiet "${head}~1" >/dev/null; then
              base="$(git rev-parse "${head}~1")"
              echo "No usable base revision, falling back to parent commit $base"
            fi

            if [ -z "$base" ]; then
              echo "No base commit available, building every local template"
              packages="$(find srcpkgs -mindepth 2 -maxdepth 2 -name template | cut -d/ -f2 | sort -u)"
            else
              echo "Comparing $base...$head"
              packages="$(git diff --name-only --diff-filter=AM "${base}...${head}" -- srcpkgs/ \
                | cut -d/ -f2 | sort -u \
                | while read -r pkg; do
                    # Only keep package directories that still contain a template.
                    if [ -n "$pkg" ] && [ -f "srcpkgs/$pkg/template" ]; then
                      printf '%s\n' "$pkg"
                    fi
                  done)"
            fi
          fi

          packages="$(printf '%s\n' "$packages" | sed '/^[[:space:]]*$/d' | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          count=0
          if [ -n "$packages" ]; then
            count="$(printf '%s\n' "$packages" | wc -w | tr -d '[:space:]')"
          fi

          : > /tmp/templates
          if [ "$count" -gt 0 ]; then
            printf '%s\n' "$packages" | tr ' ' '\n' > /tmp/templates
          fi

          {
            echo "### Changed packages"
            echo ""
            echo "- base: \`${base:-none}\`"
            echo "- head: \`${head}\`"
            echo "- packages (${count}): ${packages:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "packages=$packages"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: steps.detect.outputs.count != '0'
        run: sudo -Eu builder common/travis/build.sh "$BOOTSTRAP" "$ARCH"

      - name: Archive xbps artifacts
        if: steps.detect.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.config.arch }}-${{ matrix.config.libc }}
          path: hostdir/binpkgs/*.xbps

  deploy:
    name: Deploy repository
    runs-on: ubuntu-latest
    needs: [build]
    # Deploy only from main, never from pull_request, and only when something was built.
    if: "needs.build.outputs.count != '0' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')"
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deployment
      cancel-in-progress: false
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged

    steps:
      - name: Prepare container
        run: |
          xbps-install -Syu && xbps-install -yu && xbps-install -y git git-lfs bash

      - name: Checkout existing repo
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          lfs: true

      - name: Remove existing packages
        run: |
          xbps-rindex --remove $PWD
          rm -rf new-binpkgs

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: new-binpkgs
          merge-multiple: true

      - name: Sign packages
        run: |
          echo "${{ secrets.PRIV_KEY }}" > $HOME/privkey
          xbps-rindex -s --signedby "${{ secrets.SIGNER }}" --privkey $HOME/privkey $PWD
          xbps-rindex -S --privkey $HOME/privkey new-binpkgs/*.xbps
          rm $HOME/privkey

      - name: Remove stale versions of updated packages
        run: |
          for f in new-binpkgs/*.xbps; do
            name=$(basename "$f")
            pkg="${name%-*}"
            rm -f "$PWD/${pkg}-"*.xbps*
          done

      - name: Add packages to repo
        run: |
          xbps-rindex --clean $PWD
          cp -a new-binpkgs/. .
          xbps-rindex --add $PWD/*.xbps
          xbps-rindex --remove $PWD
          rm -rf new-binpkgs

      - name: Configure git
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Commit repo state
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "*.xbps *.xbps.sig2"
          commit_message: "Update package repo"

      - name: Create index page
        run: |
          echo '<html><head><title>Custom void repository</title></head> <body><h1>Custom void repository. Index of /</h1><hr><pre>' > index.html
          for pkg in *.xbps *.xbps.sig2; do echo "<a href=\"${pkg}\">${pkg}</a>" >> index.html; done
          echo '</body></html>' >> index.html

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
